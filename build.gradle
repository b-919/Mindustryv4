buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath "com.badlogicgames.gdx:gdx-tools:1.14.2"
    }
}

task setupUCore {
    description = 'Clones/pulls uCoreV4 into the local uCore directory for use as a project dependency'
    group = 'setup'
    doLast {
        def ucoreDir = file('uCore')
        if (ucoreDir.exists()) {
            println 'uCore already exists. Pulling latest...'
            ant.exec(executable: 'git', dir: ucoreDir) {
                arg(value: 'pull')
            }
        } else {
            println 'Cloning uCoreV4...'
            ant.exec(executable: 'git', dir: rootDir) {
                arg(value: 'clone')
                arg(value: 'https://github.com/SentinelDart919/uCoreV4.git')
                arg(value: 'uCore')
            }
        }
        println 'uCore is ready for local compilation.'
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = 'release'

    ext {
        versionNumber = '4'
        versionModifier = 'Modded by B919'
        versionType = 'unofficial'
        appName = 'Mindustry'
        gdxVersion = '1.14.2'
        gdxControllersVersion = '1.9.13'
        roboVMVersion = '2.3.0'
        uCoreVersion = '3dfb820142a0fc583ad19413a24fc5038aa29d89'

        getVersionString = {
            String buildVersion = getBuildVersion()
            return "$versionNumber-$versionModifier-$buildVersion"
        }

        getBuildVersion = {
            if(!project.hasProperty("buildversion")) return "custom build"
            return project.getProperties()["buildversion"]
        }

        getPackage = {
            return project.ext.mainClassName.substring(0, project.ext.mainClassName.indexOf("desktop") - 1)
        }

        generateLocales = {
            def output = 'en\n'
            def bundles = new File(project(':core').projectDir, 'assets/bundles/')
            bundles.listFiles().each { other ->
                if(other.name == "bundle.properties") return
                output += other.name.substring("bundle".length() + 1, other.name.lastIndexOf('.')) + "\n"
            }
            new File(project(':core').projectDir, 'assets/locales').text = output
        }

        writeVersion = {
            def pfile = new File(project(':core').projectDir, 'assets/version.properties')
            def props = new Properties()

            try{
                pfile.createNewFile()
            }catch (Exception ignored){}

            if(pfile.exists()) {

                props.load(new FileInputStream(pfile))

                String buildid = getBuildVersion()

                props["type"] = versionType
                props["number"] = versionNumber
                props["modifier"] = versionModifier
                props["build"] = buildid

                props.store(pfile.newWriter(), "Autogenerated file. Do not modify.")
            }
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url 'https://jitpack.io' }
    }
}

project(":desktop") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation project(":core")
        implementation project(":kryonet")
        if(new File(projectDir.parent, '../debug').exists() && System.properties["release"] == null) implementation project(":debug")

        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-controllers-lwjgl3:$gdxControllersVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        if(new File(projectDir.parent, 'uCore').exists()){
            implementation project(":uCore")
        }else{
            implementation "com.github.anuken:ucore:$uCoreVersion"
        }
        implementation 'com.github.MinnDevelopment:java-discord-rpc:v2.0.0'
    }
}

project(":ios") {
    apply plugin: "java"

    task copyGen{
        copy{
            from ("core/build/classes/java/main/io/anuke/mindustry/gen/"){
                include "**/*.java"
            }

            into "core/src/io/anuke/mindustry/gen"
        }

        doFirst{
            delete{
                delete "core/src/io/anuke/mindustry/gen/"
            }
        }
    }

    task incrementConfig{
        def vfile = file('robovm.properties')

        def props = new Properties()
        if(vfile.exists()){
            props.load(new FileInputStream(vfile))
        }

        props['app.id'] = 'io.anuke.mindustry'
        props['app.version'] = '4.0'
        props['app.mainclass'] = 'io.anuke.mindustry.IOSLauncher'
        props['app.executable'] = 'IOSLauncher'
        props['app.name'] = 'Mindustry'
        props['app.build'] = (!props.hasProperty("app.build") ? 40 : props['app.build'].toInteger() + 1)+""
        props.store(vfile.newWriter(), null)
    }

    build.dependsOn(incrementConfig)
    build.dependsOn(copyGen)

    dependencies {
        implementation project(":core")
        implementation project(":kryonet")

        implementation "com.mobidevelop.robovm:robovm-rt:$roboVMVersion"
        implementation "com.mobidevelop.robovm:robovm-cocoatouch:$roboVMVersion"
        implementation "com.badlogicgames.gdx:gdx-backend-robovm:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-ios"
        compileOnly project(":annotations")
    }
}

project(":core") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    task finish {
        generateLocales()
    }

    dependencies {
        build.finalizedBy(finish)

        def comp = System.properties["release"] == null || System.properties["release"] == "false"
        if(!comp) println("Note: Compiling release build.")

        if(new File(projectDir.parent, 'uCore').exists() && comp){
            implementation project(":uCore")
        }else{
            implementation "com.github.anuken:ucore:$uCoreVersion"
        }

        if(new File(projectDir.parent, '../GDXGifRecorder').exists() && comp) {
            implementation project(":GDXGifRecorder")
        }

        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-controllers:$gdxControllersVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

        compileOnly project(":annotations")
        annotationProcessor project(":annotations")
    }
}

project(":server") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    configurations {
        if(findProject(":android") != null){
            implementation.exclude module: 'android'
        }
    }
    
    dependencies {

        implementation project(":core")
        implementation project(":kryonet")
        if(new File(projectDir.parent, 'uCore').exists()){
            implementation project(":uCore")
        }else{
            implementation "com.github.anuken:ucore:$uCoreVersion"
        }
        implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(":tests"){
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        testImplementation project(":core")
        testImplementation('org.junit.jupiter:junit-jupiter-api:5.1.0')
        testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.1.0')
        testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.7.1')
        testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }

    test {
        useJUnitPlatform()
        workingDir = new File("../core/assets")
    }
}

project(":tools") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        if(new File(projectDir.parent, 'uCore').exists()){
            implementation project(":uCore")
        }else{
            implementation "com.github.anuken:ucore:$uCoreVersion"
        }
    }
}

project(":annotations") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation 'com.squareup:javapoet:1.11.0'
    }
}

project(":kryonet") {
    apply plugin: "java"
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        if(new File(projectDir.parent, 'uCore').exists()){
            implementation project(":uCore")
        }else{
            implementation "com.github.anuken:ucore:$uCoreVersion"
        }
        implementation "org.lz4:lz4-java:1.4.1"
        implementation 'com.github.Anuken:kryonet:a64d2280880e80566ca1bdaffa55de43e51cad38'
        implementation 'com.github.Anuken:WaifUPnP:05eb46bc577fd7674596946ba288c96c0cedd893'
    }
}

tasks.register('runRelay', JavaExec) {
    group = 'run'
    description = 'Runs the CLaJ relay server. Use -Pport=7000 to change the port.'
    dependsOn ':server:classes', ':core:classes'
    classpath = files(project(':server').sourceSets.main.output, project(':core').sourceSets.main.output)
    mainClass = 'io.anuke.mindustry.server.ClajRelayLauncher'
    args project.hasProperty('port') ? [project.property('port').toString()] : ['7000']
}

tasks.register('relayJar', Jar) {
    group = 'build'
    description = 'Builds a standalone CLaJ relay jar in build/release/.'
    dependsOn ':server:classes', ':core:classes'
    archiveFileName = 'claj-relay.jar'
    destinationDirectory = file("$buildDir/release")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'io.anuke.mindustry.server.ClajRelayLauncher'
    }

    from(project(':server').sourceSets.main.output) {
        include 'io/anuke/mindustry/server/ClajRelayLauncher.class'
        include 'io/anuke/mindustry/server/ClajRelayLauncher$*.class'
    }
    from(project(':core').sourceSets.main.output) {
        include 'io/anuke/mindustry/claj/ClajRelayServer.class'
        include 'io/anuke/mindustry/claj/ClajRelayServer$*.class'
        include 'io/anuke/mindustry/claj/ClajSocket.class'
        include 'io/anuke/mindustry/claj/ClajSocket$*.class'
        include 'io/anuke/mindustry/claj/ClajProtocol.class'
        include 'io/anuke/mindustry/claj/ClajProtocol$*.class'
        include 'io/anuke/mindustry/claj/ClajLink.class'
        include 'io/anuke/mindustry/claj/ClajLink$*.class'
    }
}